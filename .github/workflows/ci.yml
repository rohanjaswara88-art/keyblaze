name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Game logic tests
        run: node --test tests/*.test.js
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Server tests
        run: npm test
        working-directory: server

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t keyblaze .
      - name: Start it and check the health endpoint
        run: |
          docker run -d --name keyblaze -p 3000:3000 keyblaze
          for i in $(seq 1 20); do
            if curl -fs http://localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs keyblaze
          exit 1
