name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Game logic tests
        run: node --test tests/*.test.js
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Server tests
        run: npm test
        working-directory: server

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t keyblaze .
      - name: Start it against Postgres and smoke-test the API
        run: |
          # A throwaway Postgres, the same kind of database production uses.
          docker network create kb
          docker run -d --name pg --network kb -e POSTGRES_PASSWORD=ci postgres:17-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          docker run -d --name keyblaze --network kb -p 3000:3000 -e DATABASE_URL=postgres://postgres:ci@pg:5432/postgres keyblaze
          for i in $(seq 1 20); do
            curl -fs http://localhost:3000/api/health && break
            sleep 1
          done
          curl -fs http://localhost:3000/api/health || { docker logs keyblaze; exit 1; }
          # Creating an account writes to Postgres, so this proves the database works end to end.
          curl -fs -X POST http://localhost:3000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_check","password":"ci-password-123"}' || { docker logs keyblaze; exit 1; }
